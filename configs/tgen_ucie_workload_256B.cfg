# Controlled UCIe accelerator workload with larger 256B accesses
#
# ConvAccel local address map:
# 0x0000 - 0x0FFF : SRAM
# 0x1000          : Control register
# 0x1004          : Status register
#
# Goal:
# - Write 4 x 256B blocks to SRAM
# - Write control register
# - Read status register
# - Read 4 x 256B blocks from SRAM

# State 0: write 1024B input data into SRAM using 256B accesses
STATE 0 1000000 LINEAR 0 0 1024 256 5000 5000 1024

# State 1: write control register at 0x1000 = decimal 4096
STATE 1 1000000 LINEAR 0 4096 4100 4 5000 5000 4

# State 2: read status register at 0x1004 = decimal 4100
STATE 2 1000000 LINEAR 100 4100 4104 4 5000 5000 4

# State 3: read 1024B output data from SRAM using 256B accesses
STATE 3 1000000 LINEAR 100 0 1024 256 5000 5000 1024

INIT 0

TRANSITION 0 1 1
TRANSITION 1 2 1
TRANSITION 2 3 1
TRANSITION 3 3 1
